name = "kundli-planet"
pages_build_output_dir = "."
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# PAYU_KEY and PAYU_MODE ("test" or "live") are not secret, but Pages
# projects don't support a [previews.vars]/[vars] table in wrangler.toml
# (that's Workers-only config - `wrangler pages deploy` rejects it). Env vars
# for Pages are set per environment (Production/Preview) in the Cloudflare
# dashboard instead.
# PAYU_SALT must never go in this file - set it with:
#   npx wrangler pages secret put PAYU_SALT
# Local dev only: copy .dev.vars.example to .dev.vars (gitignored) and fill
# in test keys - `wrangler pages dev .` reads it automatically.
